<style>
.article-render {
  --ar-fg: #1f2328;
  --ar-fg-soft: #57606a;
  --ar-bg: #ffffff;
  --ar-accent: #2563eb;
  --ar-border: #e5e7eb;
  --ar-code-bg: #f6f8fa;
  max-width: 760px;
  margin: 0 auto;
  padding: 48px 20px 80px;
  background: var(--ar-bg);
  color: var(--ar-fg);
  font-family: "Noto Serif SC", "Songti SC", "SimSun", Georgia, serif;
  font-size: 17px;
  line-height: 1.9;
}
.article-render * { box-sizing: border-box; }
.article-render .ar-header { margin-bottom: 32px; border-bottom: 1px solid var(--ar-border); padding-bottom: 20px; }
.article-render .ar-home { font-family: "Noto Sans SC", system-ui, sans-serif; font-size: 14px; color: var(--ar-accent); text-decoration: none; }
.article-render .ar-home:hover { text-decoration: underline; }
.article-render .ar-meta { font-family: "Noto Sans SC", system-ui, sans-serif; font-size: 13px; color: var(--ar-fg-soft); margin: 10px 0; }
.article-render h1 { font-family: "Noto Sans SC", system-ui, sans-serif; font-size: 30px; font-weight: 700; line-height: 1.4; margin: 8px 0 0; color: #111; }
.article-render h2 { font-family: "Noto Sans SC", system-ui, sans-serif; font-size: 24px; font-weight: 700; margin: 40px 0 14px; padding-bottom: 8px; border-bottom: 1px solid var(--ar-border); }
.article-render h3 { font-family: "Noto Sans SC", system-ui, sans-serif; font-size: 20px; font-weight: 600; margin: 30px 0 10px; }
.article-render p { margin: 16px 0; }
.article-render a { color: var(--ar-accent); text-decoration: none; border-bottom: 1px solid rgba(37,99,235,.3); }
.article-render a:hover { border-bottom-color: var(--ar-accent); }
.article-render img { max-width: 100%; height: auto; display: block; margin: 24px auto; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
.article-render ul, .article-render ol { padding-left: 1.6em; margin: 16px 0; }
.article-render li { margin: 8px 0; }
.article-render blockquote { margin: 20px 0; padding: 12px 18px; border-left: 4px solid var(--ar-accent); background: #f5f8ff; color: var(--ar-fg-soft); border-radius: 0 6px 6px 0; }
.article-render code { font-family: "JetBrains Mono", "Fira Code", Consolas, monospace; font-size: .9em; background: var(--ar-code-bg); padding: .15em .4em; border-radius: 4px; }
.article-render pre { margin: 22px 0; padding: 18px; background: var(--ar-code-bg); border-radius: 10px; overflow-x: auto; border: 1px solid var(--ar-border); }
.article-render pre code { background: none; padding: 0; font-size: 14px; line-height: 1.6; }
.article-render table { border-collapse: collapse; width: 100%; margin: 22px 0; font-size: 15px; }
.article-render th, .article-render td { border: 1px solid var(--ar-border); padding: 10px 12px; text-align: left; }
.article-render th { background: #f6f8fa; font-family: "Noto Sans SC", system-ui, sans-serif; }
.article-render hr { border: none; border-top: 1px solid var(--ar-border); margin: 36px 0; }
.article-render .ar-footer { margin-top: 48px; padding-top: 18px; border-top: 1px solid var(--ar-border); font-size: 13px; color: var(--ar-fg-soft); font-family: "Noto Sans SC", system-ui, sans-serif; }
.article-render .callout { margin: 22px 0; padding: 14px 18px; border-radius: 8px; border: 1px solid var(--ar-border); border-left-width: 4px; background: #f8fafc; }
.article-render .callout-title { font-family: "Noto Sans SC", system-ui, sans-serif; font-weight: 700; margin-bottom: 6px; }
.article-render .callout.note { border-left-color: #2563eb; background: #eff6ff; }
.article-render .callout.warning { border-left-color: #d97706; background: #fffbeb; }
.article-render .callout.tip, .article-render .callout.info { border-left-color: #16a34a; background: #f0fdf4; }
.article-render .callout.danger { border-left-color: #dc2626; background: #fef2f2; }
@media (prefers-color-scheme: dark) {
  .article-render { --ar-fg:#e6edf3; --ar-fg-soft:#9aa7b4; --ar-bg:#0d1117; --ar-border:#30363d; --ar-code-bg:#161b22; }
  .article-render h1, .article-render h2 { color:#f0f6fc; }
  .article-render blockquote { background:#161b22; }
  .article-render th { background:#161b22; }
  .article-render .callout { background:#161b22; }
  .article-render .callout.note { background:#0d1b2e; }
  .article-render .callout.warning { background:#1f1605; }
  .article-render .callout.tip, .article-render .callout.info { background:#0c1a10; }
  .article-render .callout.danger { background:#1f0d0d; }
}
